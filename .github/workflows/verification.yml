name: verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      load_base_url:
        description: "Scoped test deployment URL for the optional k6 run"
        required: false
        type: string

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --reporter=dot

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m venv ../.venv
      - run: ../.venv/bin/python -m pip install -e ".[dev]"
      - run: ../.venv/bin/python -m ruff check .
      - run: ../.venv/bin/python -m pytest -p no:cacheprovider -m "not integration"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m venv .venv
      - run: ../.venv/bin/python -m pip install -e ".[dev]"
        working-directory: backend
      - run: ../.venv/bin/python -m pip_audit --strict
        working-directory: backend

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.integration.yaml up --build --abort-on-container-exit --exit-code-from backend-tests
      - if: always()
        run: docker compose -f infra/compose.integration.yaml down -v

  browser:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y

  deployment-smoke:
    runs-on: ubuntu-latest
    needs: [frontend, backend, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m venv .venv
      - run: ../.venv/bin/python -m pip install -e ".[dev]"
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run dev -- --port 4173 > /tmp/drishti-vite.log 2>&1 &
        working-directory: frontend
      - run: EV2_APP_ENVIRONMENT=test EV2_DEV_IDENTITY_ENABLED=true ../.venv/bin/python -m uvicorn app.main:app --port 8000 > /tmp/drishti-api.log 2>&1 &
        working-directory: backend
      - run: pwsh -File scripts/smoke.ps1 -CheckCompose

  load:
    if: github.event_name == 'workflow_dispatch' && inputs.load_base_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run load/k6-command.js
        env:
          BASE_URL: ${{ inputs.load_base_url }}
