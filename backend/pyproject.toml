[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-backend"
version = "0.1.0"
description = "Phase 1 API foundation for D.R.I.S.H.T.I district disaster decision support"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "uvicorn==0.35.0",
  "paho-mqtt>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.25.0",
  "pytest==8.4.1",
  "ruff==0.12.7",
  "pip-audit==2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires the PostgreSQL/PostGIS integration service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.vercel]
entrypoint = "app.main:app"
